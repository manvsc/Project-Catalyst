name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pandas scipy

      - name: Lint (basic flake8 install)
        run: |
          pip install flake8
          flake8 --ignore=E501 . || true

      - name: Smoke run
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import os
          os.environ['MPLBACKEND'] = 'Agg'
          import main  # ensure import works
          print('Imported main successfully')
          PY
